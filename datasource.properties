# Database settings shared by backend/ and frontend/.
# Each application loads this file with spring.config.import and sets agrosense.database.dir to the
# path of this folder. Nothing about the connection, the schema or the sample data is configured elsewhere.

# Connection. The password has no default on purpose: it must come from the environment.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agrosense_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# Connection pool. A few connections stay open so a request does not pay for opening one (TLS and login
# take longer than most queries here), and they are refreshed before the server drops them. Hosts that
# stop idle instances override these (see Dockerfile.vercel).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1500000

# Lazy associations that are still walked one by one are loaded in groups instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Tables come from schema.sql; Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# With SQL_INIT_MODE=always the (idempotent) schema script is applied at startup.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=${SCHEMA_LOCATION:file:${agrosense.database.dir}/schema.sql}

# User created by seed_demo.sql. Applications give it a password; see README.md.
agrosense.seed.email=demo@agrosense.co
agrosense.demo.email=demo@agrosense.co


# NOTE: a "#---" separator only counts when the lines right before and after it are not comments.

#---
spring.config.activate.on-profile=seed
# Backend "seed" profile: create the tables and load the sample rows into the configured database.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.data-locations=${SEED_LOCATION:file:${agrosense.database.dir}/seed_demo.sql}

#---
spring.config.activate.on-profile=demo
# Frontend "demo" profile: throw-away in-memory database that emulates PostgreSQL, with the sample rows.
spring.datasource.url=jdbc:h2:mem:agrosense-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.data-locations=${SEED_LOCATION:file:${agrosense.database.dir}/seed_demo.sql}
